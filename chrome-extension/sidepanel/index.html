<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="sidepanelDocTitle">Books & Vocab</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/kg-components.css">
  <link rel="stylesheet" href="../shared/kg-component-structures.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="kg-header">
    <h1 class="kg-header__title" data-i18n="vocabTitle">我的單字本</h1>
    <div class="kg-header__actions">
      <button class="kg-theme-btn" id="themeBtn" data-i18n-attr="title:themeToggleTitle;aria-label:themeToggleTitle" title="切換主題" aria-label="切換主題">
        <span id="themeIcon"></span>
      </button>
      <button class="kg-theme-btn" id="settingsBtn" data-i18n-attr="title:settings;aria-label:settingsOpenAria" title="設定" aria-label="開啟設定"></button>
    </div>
  </header>

  <!-- Notebook scope (mirrors iOS current notebook selection). -->
  <div class="kg-notebook-switcher" id="notebookSwitcher" hidden>
    <label class="kg-notebook-switcher__label" for="notebookSelect" data-i18n="notebookScope">單字本</label>
    <select class="kg-notebook-switcher__select" id="notebookSelect" data-i18n-attr="aria-label:notebookScopeAria" aria-label="選擇單字本"></select>
    <button class="kg-notebook-switcher__icon" id="notebookAddBtn" type="button"
            data-i18n-attr="title:notebookAdd;aria-label:notebookAdd" title="新增單字本" aria-label="新增單字本"></button>
    <button class="kg-notebook-switcher__icon" id="notebookEditBtn" type="button"
            data-i18n-attr="title:notebookRename;aria-label:notebookRename" title="重新命名單字本" aria-label="重新命名單字本"></button>
    <button class="kg-notebook-switcher__icon kg-notebook-switcher__icon--danger" id="notebookDeleteBtn" type="button"
            data-i18n-attr="title:notebookDelete;aria-label:notebookDelete" title="刪除單字本" aria-label="刪除單字本"></button>
  </div>

  <!-- Filter + Sort Bar (mirrors iOS KGVocabPresenter chip+sort row) -->
  <div class="kg-filter-bar" id="filterBar">
    <div class="kg-filter-bar__chips" id="filterChips"></div>
    <div class="kg-filter-bar__actions" id="filterActions"></div>
  </div>

  <!-- Search (mirrors iOS AppSearchField: leading magnifier + clear) -->
  <div class="kg-search-wrap">
    <div class="kg-search-field">
      <span class="kg-search-field__icon" id="searchIcon" aria-hidden="true"></span>
      <input type="text" class="kg-search-field__input" id="searchInput" data-i18n-attr="placeholder:searchPlaceholder" placeholder="搜尋單字…" autocomplete="off">
      <button type="button" class="kg-search-field__clear" id="searchClear" data-i18n-attr="aria-label:searchClearAria" aria-label="清除搜尋" hidden></button>
    </div>
  </div>

  <!-- State: Loading -->
  <div class="kg-state kg-state--loading" id="stateLoading">
    <div class="kg-skeleton"><div class="kg-skeleton__card"></div></div>
    <div class="kg-skeleton"><div class="kg-skeleton__card"></div></div>
    <div class="kg-skeleton"><div class="kg-skeleton__card"></div></div>
  </div>

  <!-- State: Empty -->
  <div class="kg-state kg-state--empty" id="stateEmpty" hidden>
    <div class="kg-empty">
      <span class="kg-empty__icon" id="emptyIcon" aria-hidden="true"></span>
      <p class="kg-empty__title" id="emptyTitle" data-i18n="emptyTitle">還沒有詞彙</p>
      <p class="kg-empty__subtitle" id="emptySubtitle" data-i18n="emptySubtitle">在網頁上選取文字來翻譯和收藏</p>
    </div>
  </div>

  <!-- State: Error / Login -->
  <div class="kg-state kg-state--error" id="stateError" hidden>
    <div class="kg-error" id="errorContainer">
      <span class="kg-error__icon" id="errorIcon"></span>
      <p class="kg-error__title" id="errorTitle"></p>
      <p class="kg-error__subtitle" id="errorSubtitle" hidden></p>
      <button class="kg-btn kg-error__retry" id="retryBtn"></button>
    </div>
  </div>

  <!-- State: Content -->
  <div class="kg-list" id="stateContent" hidden></div>

  <!-- Notebook management sheet — mirrors iOS NotebookEditSheet appearance basics. -->
  <section class="kg-notebook-sheet" id="notebookSheet" hidden>
    <div class="kg-notebook-sheet__scrim" id="notebookSheetScrim"></div>
    <form class="kg-notebook-sheet__panel" id="notebookForm">
      <header class="kg-notebook-sheet__header">
        <h2 class="kg-notebook-sheet__title" id="notebookSheetTitle">單字本</h2>
        <button class="kg-notebook-sheet__close" id="notebookSheetClose" type="button"
                data-i18n-attr="aria-label:detailBack" aria-label="返回"></button>
      </header>
      <div class="kg-notebook-cover-preview" id="notebookCoverPreview">
        <span class="kg-notebook-cover-preview__name" id="notebookCoverPreviewName">預覽</span>
      </div>
      <label class="kg-notebook-sheet__label" for="notebookNameInput" data-i18n="notebookNameLabel">名稱</label>
      <input class="kg-notebook-sheet__input" id="notebookNameInput" type="text" maxlength="100" autocomplete="off">
      <div class="kg-notebook-appearance">
        <p class="kg-notebook-sheet__label" data-i18n="notebookColorLabel">顏色</p>
        <div class="kg-notebook-swatches" id="notebookColorSwatches"></div>
        <p class="kg-notebook-sheet__label" data-i18n="notebookPatternLabel">圖案</p>
        <div class="kg-notebook-patterns" id="notebookPatternChoices"></div>
      </div>
      <p class="kg-notebook-sheet__error" id="notebookSheetError" hidden></p>
      <footer class="kg-notebook-sheet__actions">
        <button class="kg-btn kg-notebook-sheet__delete" id="notebookSheetDelete" type="button" hidden></button>
        <button class="kg-btn kg-btn--accent" id="notebookSheetSubmit" type="submit"></button>
      </footer>
    </form>
  </section>

  <!-- Word detail — full-cover push panel (mirrors iOS WordDetailSheet; the list
       stays mounted underneath so scroll / search / filter survive a round-trip). -->
  <section class="kg-detail-panel" id="stateDetail" hidden>
    <header class="kg-detail-panel__bar">
      <button class="kg-detail-panel__back" id="detailBack" type="button"
              data-i18n-attr="aria-label:detailBackAria" aria-label="返回單字列表"></button>
      <span class="kg-detail-panel__bar-word" id="detailBarWord"></span>
      <div class="kg-detail-panel__actions">
        <button class="kg-detail-panel__share" id="detailShare" type="button"
                data-i18n-attr="aria-label:detailShareAria;title:detailShareAria"
                aria-label="分享單字" title="分享單字"></button>
      </div>
    </header>
    <div class="kg-detail-panel__scroll" id="detailBody"></div>
  </section>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/pure.js"></script>
  <script src="../shared/vocab-outbox.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../shared/review-gradient.js"></script>
  <script src="app.js"></script>
</body>
</html>
