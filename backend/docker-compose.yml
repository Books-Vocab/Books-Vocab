version: '3.8'

services:
  kg-api:
    build: .
    container_name: knowledge-graph-api
    restart: always
    ports:
      # loopback-only：origin 只經 cloudflared(localhost) 對外。綁 0.0.0.0 會讓 8000
      # 暴露在 LAN/tailnet，繞過 Cloudflare 直打 origin（含 /admin、/api/*）。
      # 見 docs/reference/host_topology.md §Security Posture。
      - "127.0.0.1:8000:8000"
    volumes:
      - ${KG_DATA_DIR:-./data}:/app/data
      - ./certs:/app/certs:ro
      # devops.sh cmd_deploy writes the deploy SHA to ./VERSION on host and
      # rsyncs it to the remote. Mount it read-only so sentry_init._resolve_release()
      # and /api/system/info can both report the deployed commit. Without this
      # mount, /app/VERSION never exists inside the container and the Sentry
      # release tag silently degrades to None.
      - ./VERSION:/app/VERSION:ro
    env_file:
      - .env
    environment:
      # KG_DATA_DIR in .env = HOST data path (ops CLI on host + compose bind
      # source via the volume above). Inside the container data_dir must be the
      # mount target, so pin it here (environment overrides env_file).
      - KG_DATA_DIR=/app/data
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
