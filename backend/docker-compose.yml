version: '3.8'

services:
  kg-api:
    build: .
    container_name: knowledge-graph-api
    restart: always
    ports:
      # loopback-only：origin 只經 cloudflared(localhost) 對外。綁 0.0.0.0 會讓 8000
      # 暴露在 LAN/tailnet，繞過 Cloudflare 直打 origin（含 /admin、/api/*）。
      # 見 docs/reference/host_topology.md §Security Posture。
      - "127.0.0.1:8000:8000"
    volumes:
      - ${KG_DATA_DIR:-./data}:/app/data
      - ./certs:/app/certs:ro
      # The deploy path writes the deploy SHA to ./VERSION on the deploy host —
      # `devops.sh cmd_deploy` (manual) or `ops/kg_reconcile.sh` (the origin/prod
      # reconciler). No rsync since the 2026-06-15 move to standby: both pull with
      # git and write the file in place. Mount it read-only so
      # sentry_init._resolve_release() and /api/system/info can both report the
      # deployed commit. Without this mount, /app/VERSION never exists inside the
      # container and the Sentry release tag silently degrades to None.
      # NOTE: a single-file bind mount binds the INODE. Both writers truncate in
      # place (`> VERSION`); switching either to an atomic write (mktemp && mv)
      # would leave the container looking at the old inode forever.
      - ./VERSION:/app/VERSION:ro
    env_file:
      - .env
    environment:
      # KG_DATA_DIR in .env = HOST data path (ops CLI on host + compose bind
      # source via the volume above). Inside the container data_dir must be the
      # mount target, so pin it here (environment overrides env_file).
      - KG_DATA_DIR=/app/data
      # App Store cert paths follow the same split: .env holds HOST paths so the
      # bare-metal ops CLI on either machine can read them, while the container
      # needs the mount-target paths under /app/certs. Pinning them here keeps
      # .env machine-portable (oscar bare-metal / felix container share one .env).
      # If the App Store key is rotated, update the filename in BOTH places.
      - APP_STORE_CONNECT_PRIVATE_KEY_PATH=/app/certs/AuthKey_6Y7DC88RUY.p8
      - APP_STORE_ROOT_CA_PATH=/app/certs/apple_root_ca.pem
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
