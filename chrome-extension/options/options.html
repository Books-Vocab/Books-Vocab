<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsDocTitle">Books & Vocab — 設定</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/kg-components.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="kg-options">
    <h1 class="kg-options__title" data-i18n="settings">設定</h1>

    <!-- Account group -->
    <h2 class="kg-group-header"><span class="kg-group-header__icon" data-hdr-icon="account" aria-hidden="true"></span><span data-i18n="accountSection">帳號</span></h2>
    <section class="kg-card kg-group-card">
      <div class="kg-group-pad">
        <div id="auth-status"></div>
        <div id="pro-status" class="kg-pro-status" hidden></div>
        <div id="logout-area"></div>
        <div id="token-paste-area" class="kg-token-paste" hidden>
          <p class="kg-token-paste__hint" data-i18n="tokenPasteHint">或使用手動貼上 Token：</p>
          <div class="kg-token-paste__row">
            <input type="text" id="tokenInput" class="kg-token-paste__input" data-i18n-attr="placeholder:tokenPastePlaceholder" placeholder="貼上 JWT token…" autocomplete="off">
            <button id="tokenSubmit" class="kg-btn kg-btn--primary kg-token-paste__btn" data-i18n="tokenSubmit">確認</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Preferences group (選字翻譯 + 翻譯語言 + 主題 合併為一張 grouped 卡) -->
    <h2 class="kg-group-header"><span class="kg-group-header__icon" data-hdr-icon="preferences" aria-hidden="true"></span><span data-i18n="prefSection">偏好</span></h2>
    <section class="kg-card kg-group-card">
      <div class="kg-pref-row">
        <label class="kg-toggle" for="enabled-toggle">
          <span class="kg-toggle__label" data-i18n="translateToggleLabel">在網頁上選字時顯示翻譯彈窗</span>
          <input type="checkbox" id="enabled-toggle" class="kg-toggle__input">
          <span class="kg-toggle__track" aria-hidden="true"><span class="kg-toggle__thumb"></span></span>
        </label>
      </div>
      <div class="kg-pref-divider"></div>
      <div class="kg-pref-row kg-pref-row--stacked">
        <span class="kg-pref-row__label" data-i18n="translateLangSection">翻譯語言</span>
        <div class="kg-lang-row">
          <select id="sourceLangSelect" class="kg-select" data-i18n-attr="aria-label:translateSourceAria" aria-label="原文語言"></select>
          <span class="kg-lang-row__arrow" aria-hidden="true">→</span>
          <select id="targetLangSelect" class="kg-select" data-i18n-attr="aria-label:translateTargetAria" aria-label="譯文語言"></select>
        </div>
        <p class="kg-lang-row__hint" id="langHint" hidden></p>
      </div>
      <div class="kg-pref-divider"></div>
      <div class="kg-pref-row kg-pref-row--stacked">
        <span class="kg-pref-row__label" data-i18n="themeSection">主題</span>
        <div class="kg-theme-selector" id="theme-selector">
          <label class="kg-theme-option" data-theme-value="light">
            <input type="radio" name="theme" value="light" class="kg-theme-option__radio">
            <span class="kg-theme-option__swatch kg-theme-option__swatch--light"></span>
            <span class="kg-theme-option__label" data-i18n="themeLight">淺色</span>
          </label>
          <label class="kg-theme-option" data-theme-value="dark">
            <input type="radio" name="theme" value="dark" class="kg-theme-option__radio">
            <span class="kg-theme-option__swatch kg-theme-option__swatch--dark"></span>
            <span class="kg-theme-option__label" data-i18n="themeDark">深色</span>
          </label>
          <label class="kg-theme-option" data-theme-value="sepia">
            <input type="radio" name="theme" value="sepia" class="kg-theme-option__radio">
            <span class="kg-theme-option__swatch kg-theme-option__swatch--sepia"></span>
            <span class="kg-theme-option__label" data-i18n="themeSepia">懷舊</span>
          </label>
        </div>
      </div>
    </section>

    <!-- About group -->
    <h2 class="kg-group-header"><span class="kg-group-header__icon" data-hdr-icon="about" aria-hidden="true"></span><span data-i18n="aboutSection">關於</span></h2>
    <section class="kg-card kg-group-card">
      <div class="kg-group-pad">
        <p class="kg-about" data-i18n="aboutVersion">版本 0.1.0</p>
      </div>
    </section>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/pure.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="options.js"></script>
</body>
</html>
