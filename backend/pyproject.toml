[project]
name = "kg"
version = "0.1.0"
description = "Knowledge Graph for Vocabulary Recall"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0,<3.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.25,<1.0",
    "typer>=0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "tqdm>=4.0,<5.0",
    "wordfreq>=3.0,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.16,<1.0",
    "pyjwt>=2.11.0,<3.0",
    "cryptography>=46.0.5,<47.0",
    "google-auth[requests]>=2.25.0,<3.0",
    "filelock>=3.0,<4.0",
    "lemminflect>=0.2,<1.0",
]

[project.scripts]
kg = "kg.cli:app"
kg-server = "uvicorn:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module import not at top of file (FastAPI router pattern)
    "B008",  # function call in default argument (FastAPI Depends pattern)
]
