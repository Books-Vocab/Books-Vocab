<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books &amp; Vocab - Signed In</title>
<style>
:root {
  --page-bg: #F3F3F1;
  --card-bg: #FCFCFA;
  --accent: hsl(215, 28%, 66%);
  --accent-hover: hsl(215, 28%, 56%);
  --text: #2C2C2C;
  --text-secondary: #6B6B6B;
  --text-success: #2D7A3A;
  --border: #E0E0DE;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--page-bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 48px 40px;
  max-width: 440px;
  width: 100%;
  text-align: center;
}
h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
.status { font-size: 14px; margin-bottom: 24px; }
.status.ok { color: var(--text-success); }
.hint { color: var(--text-secondary); font-size: 13px; margin-top: 8px; line-height: 1.5; }
.token-box {
  background: var(--page-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 11px;
  word-break: break-all;
  max-height: 120px;
  overflow-y: auto;
  margin: 16px 0 12px;
  text-align: left;
  color: var(--text-secondary);
}
.btn-copy {
  display: inline-block;
  padding: 10px 24px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-copy:hover { background: var(--accent-hover); }
</style>
</head>
<body>
<div class="card">
  <h1>Books &amp; Vocab</h1>
  <p class="status ok">登入成功</p>
  <p class="hint">
    您已通過驗證。帳號與訂閱管理頁面即將推出，屆時登入後會自動導向您的帳號頁。
  </p>
  <!--
    A session JWT is minted server-side on this callback. The future same-origin
    web account flow will set a session cookie + redirect here instead of
    surfacing the raw token. For now the token is shown as a manual fallback so
    the flow is still usable end-to-end.
  -->
  <div class="token-box" id="token-display">{{ token }}</div>
  <button class="btn-copy" onclick="copyToken()">複製 Token</button>
</div>
<script>
function copyToken() {
  var token = {{ token | tojson }};
  navigator.clipboard.writeText(token).then(function() {
    var btn = document.querySelector('.btn-copy');
    btn.textContent = '已複製';
    setTimeout(function() { btn.textContent = '複製 Token'; }, 2000);
  });
}
</script>
</body>
</html>
