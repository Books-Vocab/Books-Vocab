name: pr-gate

# This is the only pull_request entrypoint. The component workflows run in
# parallel, but branch protection observes only `required`: a short merge gate.
# `confidence` reports the complete suite without serializing every PR behind
# the slowest backend/ops/iOS job.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-gate:
    name: repo-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1

      - name: Check repository diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Check ops test coverage classification
        run: ./ops/tests/test_ops_ci_coverage.sh

      - name: Run repository gate
        run: ./ops/test_ops.sh docs-lint worktree context-routing github-workflows

  backend-quality:
    name: backend-quality
    uses: ./.github/workflows/backend-quality.yml

  llm-eval:
    name: llm-eval
    uses: ./.github/workflows/llm-eval.yml

  design-system:
    name: design-system
    uses: ./.github/workflows/design-system.yml

  ui-quality-gate:
    name: ui-quality-gate
    uses: ./.github/workflows/ui-quality-gate.yml

  ops-suite:
    name: ops-suite
    uses: ./.github/workflows/ops-suite.yml

  ios-quality:
    name: ios-quality
    uses: ./.github/workflows/ios-quality.yml

  required:
    name: required
    if: ${{ always() }}
    needs: [repo-gate, llm-eval, design-system, ui-quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the short merge gate passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if jq -e 'to_entries | any(.value.result != "success")' <<<"$NEEDS_JSON" >/dev/null; then
            echo 'one or more required gates failed' >&2
            exit 1
          fi

  confidence:
    name: confidence
    if: ${{ always() }}
    needs: [repo-gate, backend-quality, llm-eval, design-system, ui-quality-gate, ops-suite, ios-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the complete validation fan-out
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if jq -e 'to_entries | any(.value.result != "success")' <<<"$NEEDS_JSON" >/dev/null; then
            echo 'full confidence suite has a failure; this is intentionally non-blocking for PR merge' >&2
            exit 1
          fi
