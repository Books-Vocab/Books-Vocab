version: '3.8'

services:
  kg-api:
    build: .
    container_name: knowledge-graph-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      # devops.sh cmd_deploy writes the deploy SHA to ./VERSION on host and
      # rsyncs it to the remote. Mount it read-only so sentry_init._resolve_release()
      # and /api/system/info can both report the deployed commit. Without this
      # mount, /app/VERSION never exists inside the container and the Sentry
      # release tag silently degrades to None.
      - ./VERSION:/app/VERSION:ro
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
