<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="kg-app-revision" content="{{APP_REVISION}}">
  <title>交付進度看板 · 唯讀觀測</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="admin-nav">
    <a class="brand" href="/">交付進度看板</a>
    <a class="model-link" href="/model">術語與流程</a>
    <span id="trust-state" class="trust-badge">同步確認中</span>
    <span id="trust-detail" class="trust-detail"></span>
  </header>
  <main>
    <section class="scope-panel" aria-labelledby="scope-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">FILE OCCUPANCY</span>
          <h1 id="scope-title">檔案佔用矩陣</h1>
        </div>
      </div>
      <div class="board-toolbar scope-toolbar" aria-label="矩陣檢視操作">
        <div class="board-view-actions scope-view-actions">
          <button type="button" id="scope-fullscreen" class="tree-control-button">全螢幕</button>
        </div>
        <div class="board-controls scope-controls" aria-label="矩陣檢視設定">
          <div class="tree-control-copy"><label for="scope-zoom">矩陣尺度</label></div>
          <input id="scope-zoom" type="range" min="80" max="140" step="10" value="100" aria-valuetext="100%">
          <output id="scope-zoom-value" for="scope-zoom">100%</output>
          <div class="tree-control-copy"><label for="scope-density">列距</label></div>
          <input id="scope-density" type="range" min="28" max="54" step="2" value="34" aria-valuetext="34px">
          <output id="scope-density-value" for="scope-density">34px</output>
          <label class="scope-occupied-toggle"><input id="scope-occupied-only" type="checkbox">只看有佔用檔案</label>
          <button type="button" id="scope-fit" class="tree-control-button">適合視窗</button>
          <button type="button" id="scope-reset" class="tree-control-button secondary">重設</button>
        </div>
      </div>
      <div class="scope-workspace">
        <div id="scope-matrix-wrap" class="scope-matrix-wrap" aria-live="polite">
          <p class="empty">檔案矩陣載入中</p>
        </div>
        <aside id="scope-inspector" class="scope-inspector" aria-live="polite" hidden></aside>
      </div>
      <div id="scope-fullscreen-viewer" class="scope-fullscreen-viewer" hidden aria-hidden="true">
        <div class="scope-fullscreen-shell" role="dialog" aria-modal="true" aria-labelledby="scope-fullscreen-title">
          <header class="scope-fullscreen-toolbar">
            <div class="scope-fullscreen-heading"><strong id="scope-fullscreen-title">檔案佔用矩陣</strong><span id="scope-fullscreen-zoom" aria-live="polite">100%</span></div>
            <div class="scope-fullscreen-actions" aria-label="全螢幕矩陣操作">
              <button type="button" id="scope-fullscreen-zoom-out" class="tree-control-button" aria-label="縮小矩陣">−</button>
              <button type="button" id="scope-fullscreen-zoom-in" class="tree-control-button" aria-label="放大矩陣">＋</button>
              <button type="button" id="scope-fullscreen-fit" class="tree-control-button">適合視窗</button>
              <button type="button" id="scope-fullscreen-reset" class="tree-control-button secondary">重設</button>
              <button type="button" id="scope-fullscreen-close" class="tree-control-button">關閉</button>
            </div>
          </header>
          <div id="scope-fullscreen-canvas" class="scope-fullscreen-canvas" tabindex="0" aria-label="可縮放的檔案佔用矩陣"></div>
        </div>
      </div>
    </section>

    <section class="tree-panel" aria-labelledby="tree-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">LIVE WORKFLOW</span>
          <h1 id="tree-title">分支與工作樹</h1>
        </div>
      </div>
      <div class="board-toolbar tree-toolbar" aria-label="樹狀圖檢視操作">
        <div class="board-view-actions tree-view-actions">
          <button type="button" id="tree-fullscreen" class="tree-control-button">全螢幕</button>
        </div>
        <div class="board-controls tree-controls" aria-label="樹圖設定">
          <div class="tree-control-copy"><label for="tree-zoom">圖面尺度</label></div>
          <input id="tree-zoom" type="range" min="70" max="140" step="10" value="100" aria-valuetext="100%">
          <output id="tree-zoom-value" for="tree-zoom">100%</output>
          <div class="tree-control-copy"><label for="tree-lane-spacing">工作樹間距</label></div>
          <input id="tree-lane-spacing" type="range" min="104" max="224" step="4" value="124" aria-valuetext="124px">
          <output id="tree-lane-spacing-value" for="tree-lane-spacing">124px</output>
          <button type="button" id="tree-fit" class="tree-control-button">適合視窗</button>
          <button type="button" id="tree-reset" class="tree-control-button secondary">重設</button>
        </div>
      </div>
      <div id="tree-alert" class="tree-alert" role="status"></div>
      <div class="tree-workspace">
        <div id="git-tree" class="git-tree" tabindex="0" aria-label="Git commit graph"></div>
        <div id="tree-mobile-list" class="tree-mobile-list" aria-label="分支與 commit 清單"></div>
        <aside id="commit-inspector" class="commit-inspector" aria-live="polite" hidden></aside>
      </div>
      <div id="branch-index" class="branch-index" aria-label="分支與工作樹索引"></div>
      <div id="tree-fullscreen-viewer" class="tree-fullscreen-viewer" hidden aria-hidden="true">
        <div class="tree-fullscreen-shell" role="dialog" aria-modal="true" aria-labelledby="tree-fullscreen-title">
          <header class="tree-fullscreen-toolbar">
            <div class="tree-fullscreen-heading">
              <strong id="tree-fullscreen-title">分支與工作樹</strong>
              <span id="tree-fullscreen-zoom" aria-live="polite">100%</span>
            </div>
            <div class="tree-fullscreen-actions" aria-label="全螢幕檢視操作">
              <button type="button" id="tree-fullscreen-zoom-out" class="tree-control-button" aria-label="縮小檢視">−</button>
              <button type="button" id="tree-fullscreen-zoom-in" class="tree-control-button" aria-label="放大檢視">＋</button>
              <button type="button" id="tree-fullscreen-fit" class="tree-control-button">適合視窗</button>
              <button type="button" id="tree-fullscreen-reset" class="tree-control-button secondary">重設</button>
              <button type="button" id="tree-fullscreen-close" class="tree-control-button">關閉</button>
            </div>
          </header>
          <div id="tree-fullscreen-canvas" class="tree-fullscreen-canvas" tabindex="0" aria-label="可縮放拖動的 Git 交付樹"></div>
        </div>
      </div>
    </section>

    <section class="backlog-panel" aria-labelledby="backlog-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">DELIVERY QUEUE</span>
        <h2 id="backlog-title">待處理票據</h2>
        </div>
        <span id="status" role="status"></span>
      </div>
      <nav id="tabs" class="tabs" aria-label="票面篩選">
        <button type="button" data-tab="now" aria-pressed="true">現在</button>
        <button type="button" data-tab="blocked" aria-pressed="false">阻塞</button>
        <button type="button" data-tab="inflight" aria-pressed="false">進行中</button>
        <button type="button" data-tab="ungroomed" aria-pressed="false">未梳理</button>
        <button type="button" data-tab="contract" aria-pressed="false">契約未就緒</button>
        <button type="button" data-tab="all" aria-pressed="false">全部未完成</button>
        <button type="button" data-tab="history" aria-pressed="false">歷史完成</button>
      </nav>
      <label class="search">搜尋票號或摘要
        <input id="search" type="search" inputmode="search" autocomplete="off">
      </label>
      <section id="tickets" class="tickets" aria-live="polite"></section>
    </section>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
