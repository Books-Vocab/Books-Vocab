[project]
name = "kg-llm-eval"
version = "0.1.0"
description = "LLM evaluation / prompt engineering workbench for KG"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0",
    "jinja2>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
