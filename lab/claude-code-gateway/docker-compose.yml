services:
  api:
    build: .
    ports:
      - "8090:8090"
    volumes:
      - ~/.claude:/root/.claude
      # Must be read-write: the Claude CLI rewrites .claude.json to refresh
      # OAuth tokens. A :ro mount makes the CLI fail silently (empty output).
      - ~/.claude.json:/root/.claude.json
    env_file: .env
    environment:
      - CCG_HOST=0.0.0.0
      - CCG_PORT=8090
    restart: unless-stopped
