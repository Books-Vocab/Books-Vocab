<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books &amp; Vocab - Sign In</title>
<style>
:root {
  --page-bg: #F3F3F1;
  --card-bg: #FCFCFA;
  --accent: hsl(215, 28%, 66%);
  --accent-hover: hsl(215, 28%, 56%);
  --text: #2C2C2C;
  --text-secondary: #6B6B6B;
  --border: #E0E0DE;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--page-bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 48px 40px;
  max-width: 400px;
  width: 100%;
  text-align: center;
}
h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
.subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s;
  margin-bottom: 12px;
}
.btn:hover { background: var(--page-bg); border-color: var(--accent); }
.btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.divider { color: var(--text-secondary); font-size: 12px; margin: 4px 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Books &amp; Vocab</h1>
  <p class="subtitle">Sign in to connect your Chrome extension</p>
  <a class="btn" href="/auth/web/google/login">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign in with Google
  </a>
  <form method="get" action="https://appleid.apple.com/auth/authorize">
    <input type="hidden" name="client_id" value="{{ apple_service_id }}">
    <input type="hidden" name="redirect_uri" value="{{ apple_redirect_uri }}">
    <input type="hidden" name="response_type" value="code id_token">
    <input type="hidden" name="scope" value="email">
    <input type="hidden" name="response_mode" value="form_post">
    <input type="hidden" name="state" value="{{ oauth_state }}">
    <button class="btn" type="submit">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.55 4.28-3.74 4.25z"/></svg>
    Sign in with Apple
    </button>
  </form>
</div>
</body>
</html>
