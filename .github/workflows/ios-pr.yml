name: iOS PR Check

on:
  pull_request:
    paths:
      - 'ios/**'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project ios/BooksBrowser.xcodeproj \
            -scheme BooksBrowser \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -quiet build
