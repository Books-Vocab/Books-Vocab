[project]
name = "kg"
version = "0.1.0"
description = "Knowledge Graph for Vocabulary Recall"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "numpy",
    "httpx",
    "typer",
    "python-dotenv",
    "pydantic>=2.0",
    "tqdm",
    "wordfreq",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlmodel",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.5",
    "google-auth[requests]>=2.25.0",
    "filelock",
    "lemminflect",
]

[project.scripts]
kg = "kg.cli:app"
kg-server = "uvicorn:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]
