<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Books &amp; Vocab Admin — Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f7f4;
  --surface: #fcfbfa;
  --border: #dbd6cd;
  --border-l: #e8e4db;
  --ink: #2a2520;
  --ink-light: #5a5550;
  --sub: #7a756c;
  --dev: #c0392b;
  --passed: #256246;
  --passed-bg: rgba(37,98,70,.08);
  --failed: #a7372a;
  --failed-bg: rgba(167,55,42,.08);
  --warn: #9b6b16;
  --warn-bg: rgba(155,107,22,.08);
  --idle: #69727d;
  --idle-bg: rgba(105,114,125,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.86;
  min-height: 100vh;
}
/* Nav — identical to admin dashboard */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  height: 52px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.dev-dot {
  margin-left: 8px;
  color: var(--dev);
  border: 1px solid var(--dev);
  padding: 1px 5px;
  border-radius: 2px;
  font-size: 10px;
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--ink-light);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .10em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--border); color: var(--ink-light); }
.btn-cta {
  height: 48px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #fff;
  letter-spacing: .12em;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn-cta:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 rgba(42,37,32,.25);
}
.btn-cta:disabled { background: var(--ink-light); border-color: var(--ink-light); }
#ts {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  letter-spacing: .08em;
  text-transform: uppercase;
}
/* Main */
.main {
  max-width: 1320px;
  padding: 16px;
  margin: 0 auto 42px;
}
/* Section title */
.section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--sub);
  text-transform: uppercase;
  letter-spacing: .14em;
  margin-bottom: 12px;
}
/* Status bar */
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.notice {
  font-size: 12px;
  color: var(--sub);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .04em;
}
.notice.error { color: var(--failed); }
/* Badge */
.badge {
  display: inline-block;
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.badge.idle { color: var(--idle); border-color: var(--idle); background: var(--idle-bg); }
.badge.passed { color: var(--passed); border-color: var(--passed); background: var(--passed-bg); }
.badge.failed { color: var(--failed); border-color: var(--failed); background: var(--failed-bg); }
.badge.skipped { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
/* Stat cards */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}
.stat {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  padding: 10px 12px;
}
.stat .v {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: .04em;
  color: var(--ink);
}
.stat .l {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  margin-top: 2px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
/* Table */
.table-wrap {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  overflow-x: auto;
  margin-bottom: 20px;
}
table { width: 100%; border-collapse: collapse; }
thead { background: #f3f0ea; }
th {
  text-align: left;
  padding: 9px 12px;
  border-right: 1px solid var(--border-l);
  border-bottom: 1px solid var(--border-l);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
  letter-spacing: .08em;
  text-transform: uppercase;
}
th:last-child, td:last-child { border-right: 0; }
td {
  padding: 10px 12px;
  border-right: 1px solid var(--border-l);
  border-bottom: 1px solid var(--border-l);
  vertical-align: top;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #f6f4ef; }
.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
.mono-sm {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--sub);
}
/* Check cards grid */
.checks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}
.check-card {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.check-card.included { border-color: var(--ink-light); }
.check-card.c-failed { border-color: var(--failed); }
.check-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.check-title {
  font-size: 13px;
  font-weight: 500;
}
.check-desc {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.5;
}
.check-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-top: auto;
}
.check-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.btn-sm {
  height: 28px;
  padding: 0 10px;
  font-size: 10px;
}
/* Filter toolbar */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-group { display: flex; gap: 4px; }
.filter-btn {
  height: 30px;
  padding: 0 10px;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: transparent;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  color: var(--ink-light);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.filter-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.filter-btn:hover:not(.active) { border-color: var(--ink); }
.search-input {
  flex: 1;
  min-width: 180px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink);
  outline: none;
  background: var(--surface);
}
.search-input:focus { border-color: var(--ink); }
/* Cases list */
.cases-box {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  max-height: 480px;
  overflow-y: auto;
  margin-bottom: 20px;
}
.case-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border-l);
  font-size: 13px;
}
.case-row:last-child { border-bottom: none; }
.case-row:hover { background: #f6f4ef; }
.case-row.r-failed, .case-row.r-errors { background: var(--failed-bg); }
.case-row.r-skipped { background: var(--warn-bg); }
.case-name {
  flex: 1;
  word-break: break-all;
}
.case-module {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--sub);
  flex-shrink: 0;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Output */
.output-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
}
.output-box {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #1e1a16;
  color: #e8e0d4;
  padding: 12px;
  min-height: 200px;
  max-height: 320px;
  overflow: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.empty {
  color: var(--sub);
  padding: 20px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .05em;
}
@media (max-width: 820px) {
  .output-grid { grid-template-columns: 1fr; }
  .checks-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="nav">
  <div class="brand">
    Books &amp; Vocab Admin <span class="dev-dot">TEST</span>
  </div>
  <div class="nav-actions">
    <span id="ts"></span>
    <a class="btn" id="back-link" href="/admin">Dashboard</a>
    <button class="btn" id="reload-btn">Reload</button>
    <button class="btn" id="rerun-btn" disabled>Rerun</button>
    <button class="btn btn-cta" id="run-all-btn">Run All</button>
  </div>
</div>

<div class="main">

  <!-- Status bar -->
  <div class="status-bar">
    <span id="run-badge" class="badge idle">Idle</span>
    <span id="meta" class="mono-sm"></span>
    <span id="notice" class="notice"></span>
  </div>

  <!-- Stats -->
  <div class="section-title">Summary</div>
  <div class="stats" id="stats"></div>

  <!-- Checks catalog -->
  <div class="section-title">Checks <span id="catalog-meta" class="mono-sm"></span></div>
  <div class="checks-grid" id="catalog"></div>

  <!-- Module summary -->
  <div class="section-title">Modules</div>
  <div class="table-wrap" id="modules-wrap">
    <table>
      <thead><tr><th>Module</th><th>Status</th><th>Total</th><th>Passed</th><th>Failed</th><th>Errors</th><th>Skipped</th></tr></thead>
      <tbody id="modules"></tbody>
    </table>
  </div>

  <!-- Cases -->
  <div class="section-title">Cases</div>
  <div class="filter-bar">
    <div class="filter-group" id="case-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="errors">Errors</button>
      <button class="filter-btn" data-filter="failed">Failed</button>
      <button class="filter-btn" data-filter="skipped">Skipped</button>
      <button class="filter-btn" data-filter="passed">Passed</button>
    </div>
    <input id="case-search" class="search-input" type="text" placeholder="搜尋…">
  </div>
  <div class="cases-box" id="cases"></div>

  <!-- Output -->
  <div class="section-title">Output</div>
  <div class="output-grid">
    <div>
      <div class="mono-sm" style="margin-bottom:4px">STDOUT (last 60 lines)</div>
      <pre id="stdout" class="output-box"></pre>
    </div>
    <div>
      <div class="mono-sm" style="margin-bottom:4px">STDERR (last 60 lines)</div>
      <pre id="stderr" class="output-box"></pre>
    </div>
  </div>

</div>

<script>
const _urlToken = new URLSearchParams(location.search).get('token');
if (_urlToken) {
    sessionStorage.setItem('admin_token', _urlToken);
    history.replaceState(null, '', location.pathname);
}
const TOKEN = sessionStorage.getItem('admin_token') || '';

function adminFetch(url, options = {}) {
    const headers = { ...options.headers };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    return fetch(url, {
        ...options,
        credentials: 'same-origin',
        headers,
    });
}

document.getElementById('back-link').href = '/admin';

const S = { catalog: null, run: null, caseFilter: 'all', busy: false };

const $ = id => document.getElementById(id);
const runAllBtn = $('run-all-btn');
const rerunBtn = $('rerun-btn');
const reloadBtn = $('reload-btn');
const runBadgeEl = $('run-badge');
const metaEl = $('meta');
const noticeEl = $('notice');
const statsEl = $('stats');
const catalogEl = $('catalog');
const catalogMetaEl = $('catalog-meta');
const modulesEl = $('modules');
const casesEl = $('cases');
const stdoutEl = $('stdout');
const stderrEl = $('stderr');
const caseSearchEl = $('case-search');

function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getItems() { return S.catalog?.items || []; }
function getRows() { return S.catalog?.rows || []; }
function getItemById(id) { return getItems().find(i => i.id === id) || null; }

function getItemResultMap() {
  const m = {};
  (S.run?.itemResults || []).forEach(i => m[i.id] = i);
  return m;
}

function bucketOrder(b) { return {errors:0,failed:1,skipped:2,passed:3}[b] ?? 4; }

function statusCls(s) {
  if (s === 'failed' || s === 'errors') return 'failed';
  if (s === 'passed') return 'passed';
  if (s === 'skipped') return 'skipped';
  return 'idle';
}

function statusLabel(s) {
  return {failed:'Failed',errors:'Errors',passed:'Passed',skipped:'Skipped'}[s] || 'N/A';
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function fmtDur(s) {
  if (s == null) return '—';
  if (s < 1) return s.toFixed(2)+'s';
  if (s < 10) return s.toFixed(1)+'s';
  return Math.round(s)+'s';
}

function shortName(nodeid) {
  if (!nodeid) return '?';
  const p = nodeid.split('::');
  return p[p.length - 1];
}

function scopeLabel(d) {
  if (!d || d.status === 'idle') return '—';
  const sel = d.selectedItems || [];
  if (!sel.length) return 'Full Suite';
  const labels = sel.map(id => { const it = getItemById(id); return it ? it.label : id; });
  if (labels.length <= 2) return labels.join(' + ');
  return labels.slice(0,2).join(' + ') + ' +' + (labels.length-2);
}

function stamp() {
  $('ts').textContent = new Date().toLocaleTimeString('zh-TW',{hour12:false});
}

/* ── Render ── */

function renderStats() {
  const d = S.run;
  const t = d?.totals || {total:0,passed:0,failed:0,errors:0,skipped:0};
  const scope = scopeLabel(d);
  const dur = fmtDur(d?.durationSeconds);
  const outcomeClass = statusCls(d?.outcome || 'idle');

  runBadgeEl.className = 'badge ' + outcomeClass;
  runBadgeEl.textContent = (d?.outcome || 'idle').toUpperCase();
  metaEl.textContent = d?.runId ? `run ${d.runId} · ${fmtDate(d.finishedAt || d.startedAt)}` : '尚未執行';
  rerunBtn.disabled = S.busy || !d?.runId;

  statsEl.innerHTML = [
    ['Scope', scope], ['Duration', dur], ['Total', t.total],
    ['Passed', t.passed], ['Failed', t.failed], ['Errors', t.errors], ['Skipped', t.skipped]
  ].map(([l,v]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');
}

function renderCatalog() {
  if (!S.catalog) { catalogEl.innerHTML = '<div class="empty">Loading...</div>'; return; }
  const irm = getItemResultMap();
  const items = getItems();
  catalogMetaEl.textContent = `· ${items.length} checks`;

  catalogEl.innerHTML = items.map(item => {
    const r = irm[item.id];
    const tone = statusCls(r ? r.status : 'idle');
    const included = r && r.status !== 'not_run';
    return `
      <div class="check-card ${included ? 'included' : ''} ${tone === 'failed' ? 'c-failed' : ''}">
        <div class="check-head">
          <span class="check-title">${esc(item.label)}</span>
          <span class="badge ${tone}">${r ? statusLabel(r.status) : 'N/A'}</span>
        </div>
        <div class="check-desc">${esc(item.summary)}</div>
        <div class="check-foot">
          <div class="check-tags">
            <span class="badge">${esc(item.domain)}</span>
            <span class="badge">${esc(item.column)}</span>
            ${r && r.status !== 'not_run' ? `<span class="badge">${r.total} cases</span>` : ''}
          </div>
          <button class="btn btn-sm run-item-btn" data-item-id="${esc(item.id)}">Run</button>
        </div>
      </div>`;
  }).join('');

  catalogEl.querySelectorAll('.run-item-btn').forEach(btn => {
    btn.addEventListener('click', () => runTests([btn.dataset.itemId]));
  });
  if (S.busy) catalogEl.querySelectorAll('.run-item-btn').forEach(b => b.disabled = true);
}

function renderModules() {
  const rows = S.run?.matrix || [];
  if (!rows.length) {
    modulesEl.innerHTML = '<tr><td colspan="7" class="empty">尚無結果</td></tr>';
    return;
  }
  const sorted = [...rows].sort((a,b) => ((b.errors||0)*2+(b.failed||0)) - ((a.errors||0)*2+(a.failed||0)) || (b.total||0)-(a.total||0));
  modulesEl.innerHTML = sorted.map(r => {
    const alert = (r.failed||0) > 0 || (r.errors||0) > 0;
    return `<tr>
      <td class="mono" style="font-size:11px;word-break:break-all">${esc(r.module)}</td>
      <td><span class="badge ${alert?'failed':'passed'}">${alert?'NEEDS ATTENTION':'HEALTHY'}</span></td>
      <td class="mono">${r.total||0}</td>
      <td class="mono" style="color:var(--passed)">${r.passed||0}</td>
      <td class="mono" style="color:${r.failed?'var(--failed)':'var(--sub)'}">${r.failed||0}</td>
      <td class="mono" style="color:${r.errors?'var(--failed)':'var(--sub)'}">${r.errors||0}</td>
      <td class="mono" style="color:var(--sub)">${r.skipped||0}</td>
    </tr>`;
  }).join('');
}

function renderCases() {
  const cases = S.run?.cases || [];
  const q = caseSearchEl.value.trim().toLowerCase();
  const visible = [...cases]
    .sort((a,b) => (bucketOrder(a.bucket)-bucketOrder(b.bucket)) || a.id.localeCompare(b.id))
    .filter(c => S.caseFilter === 'all' || c.bucket === S.caseFilter)
    .filter(c => !q || c.id.toLowerCase().includes(q) || c.module.toLowerCase().includes(q));

  if (!visible.length) {
    casesEl.innerHTML = '<div class="empty" style="padding:20px 14px">無符合的案例</div>';
    return;
  }
  casesEl.innerHTML = visible.slice(0,400).map(c => `
    <div class="case-row r-${esc(c.bucket)}">
      <span class="badge ${statusCls(c.bucket)}">${esc(c.status)}</span>
      <span class="case-name">${esc(shortName(c.id))}</span>
      <span class="case-module" title="${esc(c.id)}">${esc(c.module)}</span>
    </div>
  `).join('');
}

function renderOutput() {
  const d = S.run;
  stdoutEl.textContent = d?.stdoutTail?.length ? d.stdoutTail.join('\n') : 'No stdout captured.';
  stderrEl.textContent = d?.stderrTail?.length ? d.stderrTail.join('\n') : 'No stderr captured.';
}

function renderAll() {
  renderStats();
  renderCatalog();
  renderModules();
  renderCases();
  renderOutput();
  stamp();
}

/* ── Actions ── */

function setBusy(v) {
  S.busy = v;
  runAllBtn.disabled = v;
  reloadBtn.disabled = v;
  rerunBtn.disabled = v || !S.run?.runId;
  catalogEl.querySelectorAll('.run-item-btn').forEach(b => b.disabled = v);
}

function showError(msg) {
  noticeEl.className = 'notice error';
  noticeEl.textContent = msg;
}

async function runTests(itemIds = []) {
  setBusy(true);
  runBadgeEl.className = 'badge idle';
  runBadgeEl.textContent = 'RUNNING';
  const labels = itemIds.map(id => { const i = getItemById(id); return i ? i.label : id; });
  metaEl.textContent = labels.length ? 'running ' + labels.join(' + ') : 'running full suite';
  noticeEl.className = 'notice';
  noticeEl.textContent = '';
  try {
    const r = await adminFetch('/api/admin/tests/run', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({itemIds}),
    });
    if (!r.ok) { showError('Run failed: HTTP ' + r.status); return; }
    S.run = await r.json();
    renderAll();
  } catch(e) { showError('Run failed: ' + e); }
  finally { setBusy(false); }
}

async function loadCatalog() {
  try {
    const r = await adminFetch('/api/admin/tests/catalog');
    if (!r.ok) { showError('Catalog error ' + r.status); return; }
    S.catalog = await r.json();
    renderCatalog();
  } catch(e) { showError('Catalog error: ' + e); }
}

async function loadLast() {
  try {
    const r = await adminFetch('/api/admin/tests/last');
    if (!r.ok) { showError('Load failed: HTTP ' + r.status); return; }
    S.run = await r.json();
    renderAll();
  } catch(e) { showError('Load failed: ' + e); }
}

runAllBtn.addEventListener('click', () => runTests([]));
rerunBtn.addEventListener('click', () => runTests(S.run?.selectedItems || []));
reloadBtn.addEventListener('click', loadLast);
caseSearchEl.addEventListener('input', renderCases);

document.querySelectorAll('#case-filters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#case-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.caseFilter = btn.dataset.filter;
    renderCases();
  });
});

(async () => {
  await loadCatalog();
  await loadLast();
  renderAll();
})();
</script>
</body>
</html>
