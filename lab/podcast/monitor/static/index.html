<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Pipeline Monitor</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
  <div class="nav-brand">PODCAST · MONITOR</div>
  <div class="nav-ws">
    <label class="micro-label">WORKSPACE</label>
    <select id="ws-select" class="ws-select"></select>
    <button id="ws-refresh" class="icon-btn" title="Reload workspace list">↻</button>
  </div>
  <div class="nav-status">
    <span id="status-dot" class="status-dot"></span>
    <span id="status-text" class="micro-label">IDLE</span>
  </div>
</nav>

<main class="main">

  <!-- Top KPIs: cost + elapsed + current + context — one tight strip -->
  <section class="kpis">
    <div class="kpi kpi-primary">
      <div class="kpi-label">TOTAL COST</div>
      <div class="kpi-value" id="k-cost">$0.00</div>
      <div class="kpi-sub">
        <span id="k-cost-claude">$0.00</span> claude ·
        <span id="k-cost-tts">$0.00</span> tts
      </div>
    </div>
    <div class="kpi">
      <div class="kpi-label">ELAPSED</div>
      <div class="kpi-value" id="k-elapsed">—</div>
      <div class="kpi-sub" id="k-current">idle</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">CONTEXT NOW</div>
      <div class="kpi-value tabular" id="k-ctx">0</div>
      <div class="kpi-sub">
        <span id="k-ctx-pct">0%</span> of 1M · peak <span class="tabular" id="k-ctx-peak">0</span>
      </div>
      <div class="bar"><div class="bar-fill" id="k-ctx-bar"></div></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">TOKENS OUT</div>
      <div class="kpi-value tabular" id="k-tok-out">0</div>
      <div class="kpi-sub">
        fresh in <span class="tabular" id="k-tok-fresh">0</span> ·
        cache R <span class="tabular" id="k-tok-cr">0</span> ·
        W <span class="tabular" id="k-tok-cc">0</span>
      </div>
    </div>
  </section>

  <!-- Stage strip: one row, compact tiles -->
  <section class="stages" id="stage-grid"></section>

  <!-- Cost breakdown table -->
  <section class="panel">
    <div class="panel-head">
      <span class="micro-label">COST BREAKDOWN</span>
      <span class="panel-sub" id="cost-pricing-src"></span>
    </div>
    <table class="cost-table" id="cost-table">
      <thead><tr>
        <th>STAGE</th><th>MODEL</th><th class="r">CALLS</th>
        <th class="r">INPUT</th><th class="r">OUTPUT</th>
        <th class="r">CACHE R/W</th><th class="r">AUDIO</th><th class="r">USD</th>
      </tr></thead>
      <tbody id="cost-tbody"></tbody>
      <tfoot><tr>
        <td colspan="7" class="r"><strong>TOTAL</strong></td>
        <td class="r"><strong id="cost-total">$0.00</strong></td>
      </tr></tfoot>
    </table>
    <div class="cost-warnings" id="cost-warnings"></div>
  </section>

  <!-- Inline player -->
  <section class="panel" id="player-panel"></section>

  <!-- Live activity -->
  <section class="panel">
    <div class="panel-head">
      <span class="micro-label">LIVE ACTIVITY</span>
      <span class="panel-sub" id="activity-stage">idle</span>
    </div>
    <div class="feed" id="activity-feed"></div>
  </section>

</main>

<script src="/static/player.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
