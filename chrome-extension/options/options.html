<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KG 詞彙助手 — 設定</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/kg-components.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="kg-options">
    <h1 class="kg-options__title">設定</h1>

    <!-- Account section -->
    <section class="kg-card kg-section-card">
      <h2 class="kg-section-card__title">帳號</h2>
      <div id="auth-status"></div>
      <div id="token-paste-area" class="kg-token-paste" hidden>
        <p class="kg-token-paste__hint">或使用手動貼上 Token：</p>
        <div class="kg-token-paste__row">
          <input type="text" id="tokenInput" class="kg-token-paste__input" placeholder="貼上 JWT token…" autocomplete="off">
          <button id="tokenSubmit" class="kg-btn kg-btn--primary kg-token-paste__btn">確認</button>
        </div>
      </div>
    </section>

    <!-- Selection-to-translate master switch -->
    <section class="kg-card kg-section-card">
      <h2 class="kg-section-card__title">選字翻譯</h2>
      <label class="kg-toggle" for="enabled-toggle">
        <span class="kg-toggle__label">在網頁上選字時顯示翻譯彈窗</span>
        <input type="checkbox" id="enabled-toggle" class="kg-toggle__input">
        <span class="kg-toggle__track" aria-hidden="true"><span class="kg-toggle__thumb"></span></span>
      </label>
    </section>

    <!-- Theme section -->
    <section class="kg-card kg-section-card">
      <h2 class="kg-section-card__title">主題</h2>
      <div class="kg-theme-selector" id="theme-selector">
        <label class="kg-theme-option" data-theme-value="light">
          <input type="radio" name="theme" value="light" class="kg-theme-option__radio">
          <span class="kg-theme-option__swatch kg-theme-option__swatch--light"></span>
          <span class="kg-theme-option__label">淺色</span>
        </label>
        <label class="kg-theme-option" data-theme-value="dark">
          <input type="radio" name="theme" value="dark" class="kg-theme-option__radio">
          <span class="kg-theme-option__swatch kg-theme-option__swatch--dark"></span>
          <span class="kg-theme-option__label">深色</span>
        </label>
        <label class="kg-theme-option" data-theme-value="sepia">
          <input type="radio" name="theme" value="sepia" class="kg-theme-option__radio">
          <span class="kg-theme-option__swatch kg-theme-option__swatch--sepia"></span>
          <span class="kg-theme-option__label">懷舊</span>
        </label>
      </div>
    </section>

    <!-- About section -->
    <section class="kg-card kg-section-card">
      <h2 class="kg-section-card__title">關於</h2>
      <p class="kg-about">版本 0.1.0</p>
    </section>
  </div>
  <script src="../shared/pure.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="options.js"></script>
</body>
</html>
