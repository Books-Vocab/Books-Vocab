schema_version: 1
description: KG promotion screenshot rendering inventory.

sources:
  iphone_framed:
    path: promotion/screenshots/sources/iphone-framed
    type: framed_iphone_png

outputs:
  app_store_iphone:
    path: promotion/screenshots/dist/app-store/iphone
    legacy_path: docs/assets/screenshots/iphone
    size: [1284, 2778]
  web_public:
    path: promotion/screenshots/dist/web
    legacy_path: backend/static/img/screenshots
    size: [462, 1000]

scripts:
  render:
    path: promotion/screenshots/scripts/render_screenshots.py
    default_target: promotion
    legacy_target: legacy
  tests:
    path: promotion/screenshots/tests/test_render_screenshots.py

shots:
  - id: vocab_list
    source: 01_vocab_list.png
    app_store_output: final_01_vocab_list.png
    web_output: iphone-vocab-list.png
    title: 你的單字，一目了然
    subtitle: 自動追蹤學習進度，掌握每個單字的熟練狀態
  - id: review_card
    source: 02_review_card.png
    app_store_output: final_02_review_card.png
    web_output: iphone-review-card.png
    title: 在原文語境中複習
    subtitle: 釋義、發音、例句、關聯詞——一張卡片全掌握
  - id: knowledge_graph
    source: 03_other.png
    app_store_output: final_03_other.png
    web_output: iphone-knowledge-graph.png
    title: 單字不再孤立
    subtitle: 知識圖譜串起詞彙網絡，越讀越融會貫通
  - id: reader
    source: 04_reader.png
    app_store_output: final_04_reader.png
    web_output: iphone-reader.png
    title: 閱讀中即查即學
    subtitle: 輕觸生詞即時翻譯，閱讀不中斷、學習不費力
