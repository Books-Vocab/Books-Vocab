<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KG 詞彙</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/kg-components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="kg-header">
    <h1 class="kg-header__title">詞彙</h1>
    <div class="kg-header__actions">
      <button class="kg-theme-btn" id="themeBtn" title="切換主題" aria-label="切換主題">
        <span id="themeIcon">🌗</span>
      </button>
      <button class="kg-theme-btn" id="settingsBtn" title="設定" aria-label="開啟設定">⚙️</button>
    </div>
  </header>

  <!-- Search -->
  <div class="kg-search-wrap">
    <input type="text" class="kg-input kg-search" id="searchInput" placeholder="搜尋詞彙…" autocomplete="off">
    <span class="kg-search__count" id="searchCount"></span>
  </div>

  <!-- State: Loading -->
  <div class="kg-state kg-state--loading" id="stateLoading">
    <div class="kg-skeleton"><div class="kg-skeleton__card"></div></div>
    <div class="kg-skeleton"><div class="kg-skeleton__card"></div></div>
    <div class="kg-skeleton"><div class="kg-skeleton__card"></div></div>
  </div>

  <!-- State: Empty -->
  <div class="kg-state kg-state--empty" id="stateEmpty" hidden>
    <div class="kg-empty">
      <svg class="kg-empty__illustration" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="20" y="30" width="80" height="60" rx="6" fill="var(--stage-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
        <path d="M35 45h50M35 55h40M35 65h45M35 75h30" stroke="var(--divider)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="85" cy="85" r="18" fill="var(--brand-hero)" fill-opacity="0.25"/>
        <path d="M78 85l5 5 10-10" stroke="var(--on-brand-hero)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="kg-empty__title">還沒有詞彙</p>
      <p class="kg-empty__subtitle">在網頁上選取文字來翻譯和收藏</p>
    </div>
  </div>

  <!-- State: Error / Login -->
  <div class="kg-state kg-state--error" id="stateError" hidden>
    <div class="kg-error" id="errorContainer">
      <span class="kg-error__icon" id="errorIcon"></span>
      <p class="kg-error__title" id="errorTitle"></p>
      <p class="kg-error__subtitle" id="errorSubtitle" hidden></p>
      <button class="kg-btn kg-error__retry" id="retryBtn"></button>
    </div>
  </div>

  <!-- State: Content -->
  <div class="kg-list" id="stateContent" hidden></div>

  <script src="../shared/pure.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
