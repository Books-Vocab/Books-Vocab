[project]
name = "kg"
version = "0.1.0"
description = "Knowledge Graph for Vocabulary Recall"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0,<3.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.25,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "wordfreq>=3.0,<4.0",
    "fastapi>=0.115,<1.0",
    "starlette>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.16,<1.0",
    "pyjwt>=2.11.0,<3.0",
    "cryptography>=48.0.0,<49.0",
    "google-auth[requests]>=2.25.0,<3.0",
    "filelock>=3.0,<4.0",
    "lemminflect>=0.2,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.7,<1.0",
    "psutil>=5.9,<8.0",
    "sentry-sdk[fastapi]>=2.0,<3.0",
]

[project.scripts]
kg-server = "uvicorn:main"

# Dev / test dependencies. PEP 735 dependency group — installed by
# `uv sync` (uv installs the default `dev` group automatically) but excluded
# from the runtime wheel.
#
# Why this is required: when pytest is not present in the project venv,
# `uv run pytest` silently falls back to a Homebrew system Python (e.g. 3.14)
# that lacks `sentry-sdk`. That made `import sentry_sdk` inside
# `kg.observability_alerts` fail, `_sentry_sdk` resolved to `None`, and every
# `_emit` short-circuited at the `_sentry_sdk is None` guard — manifesting as
# 8 flaky-looking test failures whose stubs never recorded a call. Pinning
# pytest into the venv eliminates that interpreter mismatch entirely.
[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.26,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module import not at top of file (FastAPI router pattern)
    "B008",  # function call in default argument (FastAPI Depends pattern)
]
