version: 2
description: "KG documentation ownership and impact registry. GitHub owns work items; this file owns document routing only."

agent_facing_surface:
  paths:
    - CLAUDE.md
    - .claude/agents/
    - .claude/skills/
    - docs/reference/agent_context.md
    - docs/reference/product_surface.md
    - docs/reference/tech_index.md
    - docs/sop/
    - docs/policy/
    - docs/runbook/system.md
    - ops/context_route.py
    - ops/context_plane.json
    - ops/skill_route.py
    - ops/capability_matrix.py

documents:
  - id: contract.sync_lifecycle
    path: docs/reference/sync_lifecycle.md
    kind: contract
    authority: SoT
    triggers:
      - sync-behavior-changed
    sources:
      - ios/BooksAndVocab/Services/
      - backend/src/kg/routers/

  - id: contract.card_format
    path: docs/reference/card_format.md
    kind: contract
    authority: SoT
    triggers:
      - card-schema-changed
    sources:
      - backend/src/kg/
      - ios/BooksAndVocab/Models/

  - id: contract.host_topology
    path: docs/reference/host_topology.md
    kind: contract
    authority: SoT
    triggers:
      - host-or-domain-changed
    sources:
      - ops/devops_kg_safe.sh
      - ops/kg_reconcile.sh
      - backend/deploy/

  - id: policy.safety
    path: docs/policy/safety.md
    kind: policy
    authority: SoT
    triggers:
      - production-safety-changed
    sources:
      - ops/devops_kg_safe.sh
      - ops/release.sh
      - ops/kg_reconcile.sh

  - id: reference.agent_context
