name: pr-gate

# This is the only pull_request entrypoint. The component workflows run in
# parallel, but branch protection observes only `required`: a short PR gate.
# Merge queue groups use the separate merge-group-required workflow so queue
# admission never waits for the full confidence fan-out below.
on:
  pull_request:
    # `ready_for_review` changes metadata only. The latest opened/synchronize
    # run already validates the same head; rerunning would cancel or duplicate
    # its full-confidence fan-out without producing new code evidence.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-gate:
    name: repo-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check repository diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ "$HEAD_SHA"
          fi

      - name: Check ops test coverage classification
        run: ./ops/tests/test_ops_ci_coverage.sh

      - name: Run repository gate
        run: ./ops/test_ops.sh docs-lint worktree context-routing github-workflows

  changed-paths:
    name: classify confidence scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      ops: ${{ steps.plan.outputs.ops }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify non-blocking confidence scope
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            ./ops/ci_scope_router.sh --base "$BASE_SHA" --head "$HEAD_SHA" --format github-output >> "$GITHUB_OUTPUT"
          else
            ./ops/ci_scope_router.sh --all --format github-output >> "$GITHUB_OUTPUT"
          fi

  backend-quality:
    name: backend-quality
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-quality.yml

  llm-eval:
    name: llm-eval
    uses: ./.github/workflows/llm-eval.yml

  design-system:
    name: design-system
    uses: ./.github/workflows/design-system.yml

  ui-quality-gate:
    name: ui-quality-gate
    uses: ./.github/workflows/ui-quality-gate.yml

  ops-suite:
    name: ops-suite
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.ops == 'true' }}
    uses: ./.github/workflows/ops-suite.yml

  ios-quality:
    name: ios-quality
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.ios == 'true' }}
    uses: ./.github/workflows/ios-quality.yml

  required:
    name: required
    if: ${{ always() }}
    needs: [repo-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Assert the short merge gate passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if jq -e 'to_entries | any(.value.result != "success")' <<<"$NEEDS_JSON" >/dev/null; then
            echo 'one or more required gates failed' >&2
            exit 1
          fi

  confidence:
    name: confidence
    if: ${{ always() }}
    needs: [changed-paths, repo-gate, backend-quality, llm-eval, design-system, ui-quality-gate, ops-suite, ios-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report the complete validation fan-out
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN_JSON: >-
            {"backend":"${{ needs.changed-paths.outputs.backend }}","ops":"${{ needs.changed-paths.outputs.ops }}","ios":"${{ needs.changed-paths.outputs.ios }}"}
        run: |
          set -euo pipefail
          ./ops/ci_confidence_verdict.sh --plan "$PLAN_JSON" --needs "$NEEDS_JSON"
