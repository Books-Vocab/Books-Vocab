name: Backend Release

on:
  push:
    tags:
      - 'api/*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t kg-test -f backend/Dockerfile backend/

      - name: Run pytest
        run: |
          docker run --rm \
            -e JWT_SECRET=test-secret \
            -e ADMIN_TOKEN=test-admin \
            -e GEMINI_API_KEY=test \
            -e GOOGLE_CLIENT_ID=test \
            -e APPLE_BUNDLE_ID=com.test \
            -e APP_STORE_CONNECT_ISSUER_ID=test \
            -e APP_STORE_CONNECT_KEY_ID=test \
            kg-test pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#api/}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to server
        run: |
          rsync -az --stats \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'certs' \
            --exclude 'data' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            backend/ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:~/knowledge_graph_api/

      - name: Docker build & start
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }} \
            "cd ~/knowledge_graph_api && docker compose up -d --build 2>&1 | tail -20"

      - name: DB Migration
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }} \
            "docker exec knowledge-graph-api python3 -c \"
          import sqlite3, pathlib
          for db in pathlib.Path('/app/data/users').rglob('cards.db'):
              conn = sqlite3.connect(db)
              for col, typ in [('root_form', 'TEXT'), ('inflections', 'TEXT')]:
                  try:
                      conn.execute(f'ALTER TABLE cards ADD COLUMN {col} {typ}')
                  except:
                      pass
              conn.commit()
              conn.close()
          print('migration done')
          \""

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ubuntu@${{ secrets.LIGHTSAIL_HOST }} \
              "curl -o /dev/null -s -w '%{http_code}' http://localhost:8000/docs" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, waiting 5s..."
            sleep 5
          done
          echo "✗ Health check failed"
          exit 1

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          CHANGELOG=$(scripts/generate-changelog.sh api)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Backend ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          tag_name: ${{ github.ref_name }}
